name: Deploy

# Deploy otomatis ke VPS setelah CI di main hijau. Bisa juga dijalankan manual.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: kalkulator-gaji-gross
  CONTAINER: kalkulator-gaji-gross

jobs:
  deploy:
    name: Build image & deploy ke VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Siapkan SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Kirim image & jalankan ulang container
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST"
          docker save "$IMAGE:latest" | gzip | $SSH 'gunzip | docker load'
          $SSH "docker rm -f $CONTAINER 2>/dev/null || true; \
            docker run -d --name $CONTAINER --restart unless-stopped \
              -p 127.0.0.1:3100:3000 $IMAGE:latest && \
            docker image prune -f"

      - name: Cek kesehatan
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://gaji.jrcomp.biz.id/ || true)
            [ "$code" = "200" ] && echo "OK" && exit 0
            sleep 3
          done
          echo "Health check gagal (last code: $code)"; exit 1
